<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الدردشة - ON-Field</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 85vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* شريط جانبي للمستخدمين المتصلين */
        .sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #667eea;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
            border-bottom: 2px solid #667eea;
            text-align: center;
        }

        .sidebar-header h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .users-count {
            font-size: 12px;
            color: #bdc3c7;
            background: rgba(102, 126, 234, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        #users-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .user-online {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .user-online:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #667eea;
            object-fit: cover;
        }

        .user-details {
            flex: 1;
            overflow: hidden;
        }

        .user-details strong {
            display: block;
            font-size: 14px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-details small {
            color: #bdc3c7;
            font-size: 12px;
        }

        .online-indicator {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* منطقة الدردشة الرئيسية */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h2 {
            color: #2c3e50;
            font-size: 24px;
        }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #2ecc71;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* منطقة الرسائل */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            justify-content: flex-start;
            animation: slideIn 0.3s ease-in-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.current-user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 60%;
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message-content.current-user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-header .user-avatar {
            width: 32px;
            height: 32px;
        }

        .user-info {
            flex: 1;
        }

        .user-info strong {
            display: block;
            font-size: 14px;
        }

        .user-position {
            font-size: 12px;
            opacity: 0.7;
            margin-right: 5px;
        }

        .message-time {
            font-size: 12px;
            opacity: 0.6;
            white-space: nowrap;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .message-actions button {
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .edit-btn {
            background: #3498db;
            color: white;
        }

        .edit-btn:hover {
            background: #2980b9;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .system-message {
            text-align: center;
            color: #7f8c8d;
            font-size: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            animation: slideIn 0.3s ease-in-out;
        }

        .typing-indicator {
            text-align: center;
            color: #7f8c8d;
            font-size: 12px;
            font-style: italic;
            margin: 10px 0;
            animation: slideIn 0.3s ease-in-out;
        }

        .error-message {
            background: #ffe6e6;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #e74c3c;
        }

        .message-input-area {
            padding: 20px;
            background: white;
            border-top: 2px solid #e0e0e0;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            transition: border-color 0.3s;
        }

        #message-input:focus {
            outline: none;
            border-color: #667eea;
        }

        #send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #send-btn:active {
            transform: translateY(0);
        }

        /* شريط التمرير المخصص */
        #messages-container::-webkit-scrollbar {
            width: 8px;
        }

        #messages-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #messages-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        #messages-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* استجابة الهاتف */
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                max-height: 150px;
                border-left: none;
                border-bottom: 2px solid #667eea;
                overflow-x: auto;
                flex-direction: row;
            }

            .sidebar-header {
                min-width: 200px;
            }

            #users-list {
                display: flex;
                gap: 10px;
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .user-online {
                min-width: 120px;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- الشريط الجانبي للمستخدمين -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>👥 المتصلون</h3>
                <span class="users-count" id="users-count">0</span>
            </div>
            <div id="users-list"></div>
        </div>

        <!-- منطقة الدردشة الرئيسية -->
        <div class="chat-main">
            <!-- رأس الدردشة -->
            <div class="chat-header">
                <h2>💬 غرفة الدردشة الرئيسية</h2>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    <span>جميع اللاعبين متصلون</span>
                </div>
            </div>

            <!-- منطقة الرسائل -->
            <div id="messages-container"></div>

            <!-- منطقة إدخال الرسالة -->
            <div class="message-input-area">
                <input
                    type="text"
                    id="message-input"
                    placeholder="اكتب رسالة... (Shift+Enter لسطر جديد)"
                    autocomplete="off"
                />
                <button id="send-btn">إرسال</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="chat-client.js"></script>

    <script>
        // تحديث عدد المستخدمين المتصلين
        setInterval(() => {
            const count = document.querySelectorAll('.user-online').length;
            document.getElementById('users-count').textContent = count;
        }, 500);
    </script>
</body>
</html>
